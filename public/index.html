<title>Diario Libre — Simulador y Validador de Publicidad</title>
<style>
:root{--bg:#f2f2f2;--pn:#fff;--tx:#111;--mu:#666;--bd:#bbb;--ac:#000;--acf:#fff;--ok:#222;--wa:#555;--er:#000;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0d0d;--pn:#1a1a1a;--tx:#f2f2f2;--mu:#999;--bd:#444;--ac:#fff;--acf:#000;--ok:#ddd;--wa:#aaa;--er:#fff}}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:13px system-ui,Segoe UI,Arial,sans-serif}
*{box-sizing:border-box}
header{display:flex;gap:12px;align-items:center;padding:8px 14px;background:var(--pn);border-bottom:1px solid var(--bd)}
header h1{font-size:15px;margin:0;flex:1}
nav button{margin-left:4px}
button,select,input{font:inherit;color:var(--tx);background:var(--pn);border:1px solid var(--bd);border-radius:6px;padding:5px 8px}
button{cursor:pointer}button:hover{border-color:var(--ac)}button.p{background:var(--ac);color:var(--acf);border-color:var(--ac)}button.on{border-color:var(--ac);color:var(--ac);font-weight:600}
#app{display:grid;grid-template-columns:270px 1fr 290px;height:calc(100% - 46px)}
aside{background:var(--pn);padding:10px;overflow:auto;display:flex;flex-direction:column;gap:8px}
aside h3{margin:6px 0 2px;font-size:12px;text-transform:uppercase;color:var(--mu)}
#L{border-right:1px solid var(--bd)}#R{border-left:1px solid var(--bd)}
#C{display:flex;flex-direction:column;min-width:0}
#bar{display:flex;gap:6px;flex-wrap:wrap;padding:6px 10px;background:var(--pn);border-bottom:1px solid var(--bd);align-items:center}
#view{flex:1;overflow:auto;padding:16px;text-align:center}
#wrap{display:inline-block;position:relative;box-shadow:0 2px 14px #0005;background:#fff}
#stage{position:absolute;left:0;top:0;width:822px;height:1106px;transform-origin:0 0;background:#fff center/100% 100% no-repeat;overflow:hidden;user-select:none}
.rec{font-family:Georgia,serif;color:#222}
.rec .mh{position:absolute;left:42px;top:20px;right:43px;height:34px;border-bottom:3px solid #111;font:700 22px Georgia}
.rec .hl{position:absolute;left:42px;top:70px;width:737px;height:70px;font:800 40px/1 Georgia}
.rec .cl{position:absolute;top:150px;height:905px;width:112px;background:repeating-linear-gradient(#0000 0 5px,#9ca3af 5px 7px)}
.rec .im{position:absolute;background:#d4d4d4;border:1px solid #888}.slot{position:absolute;border:2px dashed #555;background:#e5e5e5;display:flex;align-items:center;justify-content:center;text-align:center;font:600 13px system-ui;color:#444}
.gd{position:absolute;top:65px;height:990px;width:112px;background:#00000014;border:1px dashed #666}
.ad{position:absolute;outline:2px solid #000;cursor:move;background:#fff;overflow:hidden}
.ad.sel{outline:3px dashed #000;outline-offset:2px;z-index:5}
.ad img{width:100%;height:100%;display:block;pointer-events:none}
.ad .lb{position:absolute;left:0;top:0;background:#000;color:#fff;font:600 11px system-ui;padding:1px 5px;pointer-events:none}
.ok{color:var(--ok)}.wa{color:var(--wa)}.er{color:var(--er)}
.res{border-left:4px solid;padding:4px 8px;margin:4px 0;background:var(--bg);border-radius:4px}
.res{border-left-width:6px}.res.ok{border-color:var(--ok);border-left-style:solid}.res.wa{border-color:var(--wa);border-left-style:dashed}.res.er{border-color:var(--er);border-left-style:double}
.fmt{display:flex;gap:8px;align-items:center;padding:4px;border:1px solid var(--bd);border-radius:6px;cursor:pointer}
.fmt.on{border-color:var(--ac);background:var(--bg)}
.fmt i{display:block;background:#bbb;border:1px solid var(--ac);flex:none}
.li{display:flex;justify-content:space-between;gap:4px;padding:3px 4px;border:1px solid var(--bd);border-radius:6px;cursor:pointer}
.li.on{border-color:var(--ac);border-style:dashed}
table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid var(--bd);padding:5px;text-align:left}
#cat{display:none;padding:14px;overflow:auto}
.sm{font-size:11px;color:var(--mu)}
@media(max-width:900px){#app{grid-template-columns:1fr;height:auto}}

function validate(a){const f=fmOf(a.fm),R=[],i=a.info,tw=wIn(f.c),th=hE(f.h),tr2=tw/f.h;
 if(f.h>MAXIN)R.push(['er','El formato excede el máximo de '+MAXIN+' in.','Reduce el largo.']);
 if(f.h>=MAXIN)R.push(['wa','Formato de 13 in: se ocupa la altura útil completa de 13,75 in, sin espacio sobrante.','Confirmar con producción si la altura oficial es 13 o 13,75 in.']);
 if(a.y<Y0||a.y+a.h>Y0+H+.5)R.push(['er','El anuncio queda fuera del área útil de la página.','Muévelo dentro de los límites.']);
 if(!i)return R;
 if(i.bad){R.push(['er','Archivo ilegible o dañado.','Vuelve a exportar el arte.']);return R}
 const tr=tw/th;
 if(i.type==='pdf'){const pr=(i.wIn/i.hIn);const d=Math.min(Math.abs(pr-tr)/tr,Math.abs(pr-tr2)/tr2);
  R.push([d>.02?'er':'ok',`Página PDF: ${i.wIn.toFixed(2)} × ${i.hIn.toFixed(2)} in (esperado ${tw.toFixed(2)} × ${th} in).`,d>.02?'Reexporta el PDF al tamaño del formato.':'Dimensión física coincide.']);
  if(i.pages>1)R.push(['wa',`El PDF tiene ${i.pages} páginas.`,'Envía un PDF de una sola página.']);
  R.push(['wa','Resolución de PDF no determinada (no se analizaron sus imágenes).','Verifica que las imágenes internas tengan resolución suficiente.']);
 }else{const r=i.w/i.h,d=Math.min(Math.abs(r-tr)/tr,Math.abs(r-tr2)/tr2),dpi=i.w/tw;
  R.push([d>.05?'er':d>.01?'wa':'ok',`Proporción ${r.toFixed(3)} vs esperada ${tr.toFixed(3)} (${(d*100).toFixed(1)} % de diferencia).`,d>.01?'Usa “Ajustar”, “Recortar” o reexporta; no se deforma el arte.':'Proporción correcta.']);
  if(d>.01&&a.fit==='cover'){const lost=1-Math.min(r,tr)/Math.max(r,tr);R.push(['wa',`Con recorte se pierde aprox. ${(lost*100).toFixed(1)} % del área.`,'Revisa que no se corte texto o logotipo.'])}
  R.push([dpi<100?'er':dpi<200?'wa':'ok',`Resolución efectiva ≈ ${Math.round(dpi)} ppp al ancho del formato (los píxeles no traen tamaño físico).`,dpi<200?'Referencia provisional: mínimo 200 ppp, aún sin confirmar.':'Resolución suficiente (criterio provisional).'])}
 if(i.size>25e6)R.push(['wa','Archivo mayor a 25 MB.','Comprime si el periódico lo exige.']);
 return R}

// guardado automático (IndexedDB)
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('dl_sim',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbSet(k,v){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('k','readwrite');t.objectStore('k').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function idbGet(k){const d=await idb();return new Promise((res,rej)=>{const q=d.transaction('k').objectStore('k').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
